name: release-runtime-qualification
on:
  pull_request:
    paths:
      - releases/v0.7.8.json
permissions:
  contents: read
  actions: read
jobs:
  rec03:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/rec03.yml
    permissions:
      contents: read
      actions: read
      checks: write
    with:
      record_commit: ${{ github.event.pull_request.head.sha }}
  sealed:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/sealed-recovery.yml
    permissions:
      contents: read
      actions: read
      checks: write
    with:
      release: v0.7.8
      record_commit: ${{ github.event.pull_request.head.sha }}
