name: meta-ci

# Validates the meta-repo itself: bootstrap.sh is a sane script and the full-stack
# docker-compose (which `include:`s vidra-core's compose) resolves correctly.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: External actions use immutable commit pins
        run: |
          bad=$(
            grep -rnE '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]+' .github/workflows \
              | grep -vE 'uses:[[:space:]]+\./' \
              | grep -vE '@[0-9a-f]{40}([[:space:]]+#.*)?[[:space:]]*$' || true
          )
          if [ -n "$bad" ]; then
            echo "::error::External actions must be pinned to a full 40-character commit SHA:" >&2
            echo "$bad" >&2
            exit 1
          fi
          echo "OK: every external action uses an immutable commit pin."

      # Step 0 of the readiness plan. `env/*.env` holds real secrets, and
      # deploy/rollback.sh writes `env/production.env.bak` — a byte-for-byte copy
      # of them that the `env/*.env` glob does NOT match on its own. Both must
      # stay ignored, and the *.example templates must stay tracked.
      - name: Filled-in env files (and their .bak copies) are git-ignored
        run: |
          git check-ignore -q env/production.env \
            || { echo "::error::env/production.env is NOT git-ignored"; exit 1; }
          git check-ignore -q env/production.env.bak \
            || { echo "::error::env/production.env.bak is NOT git-ignored (deploy/rollback.sh writes it)"; exit 1; }
          if git check-ignore -q env/production.env.example; then
            echo "::error::env/production.env.example must stay TRACKED, but it is ignored" >&2
            exit 1
          fi
          echo "OK: concrete env files and their .bak copies are ignored; templates are not."

      # `-x` so shellcheck FOLLOWS the `. "$REPO_ROOT/deploy/lib.sh"` in the four
      # stack scripts and deploy/compose.sh (each carries a `# shellcheck
      # source=deploy/lib.sh` directive). Without it every caller reports SC1091
      # and, worse, nothing checks that the library's contract — ENV_FILE and
      # log() defined before the source line — is actually met at each call site.
      #
      # The root scripts are listed BY NAME because `deploy/*.sh` does not reach
      # them, and a new one added to the repo root is otherwise linted by nothing.
      - name: Lint shell scripts
        run: |
          for f in bootstrap.sh install.sh deploy/*.sh; do
            bash -n "$f"
            shellcheck -x "$f"
          done

      # install.sh is the only script here that runs on a machine which has
      # nothing yet: no clone, no docker, no vidra, and — under
      # `curl … | sh` — /bin/sh rather than bash. So the smoke test is `sh`, not
      # `bash`: on this runner that is dash, and dash is what a Debian or Ubuntu
      # host pipes the script into. A bashism in the argument parser is invisible
      # to shellcheck (the shebang says bash) and fatal in production.
      #
      # `--help` is the whole test surface on purpose. It is parsed before the
      # platform check, before the privilege check and before the first network
      # call, so this step needs no network, no root and no docker — and if that
      # ordering ever regresses, the step goes red instead of an operator's
      # `--help` trying to apt-get install Docker.
      - name: install.sh --help needs no network, no root and no clone
        run: |
          out="$(sh install.sh --help)"
          case "$out" in
            *"usage:"*"install.sh"*) ;;
            *) echo "::error::sh install.sh --help printed no usage line" >&2; exit 1 ;;
          esac
          for flag in --yes --ref --dir --owner --git VIDRA_YES VIDRA_REF VIDRA_HOME VIDRA_GH_OWNER VIDRA_INSTALL_GIT; do
            case "$out" in
              *"$flag"*) ;;
              *) echo "::error::sh install.sh --help does not document $flag" >&2; exit 1 ;;
            esac
          done
          echo "OK: install.sh --help exits 0 under /bin/sh ($(readlink -f /bin/sh)) and documents every flag and environment variable."

      # deploy/Caddyfile is bind-mounted read-only into the `caddy` service by
      # docker-compose.prod.yml, and Caddy parses it only when that container
      # starts — so a typo or an unknown directive does not surface as a failed
      # deploy step, it surfaces as a crash-looping TLS terminator, which is the
      # whole site down. `docker compose config` cannot see inside a mounted
      # file, so nothing else in this job covers it. `caddy validate` adapts the
      # Caddyfile to JSON and provisions every module exactly as a real start
      # would, which is precisely the failure being pre-empted. Same image the
      # overlay runs; `--network none` because adapting must not need DNS, the
      # network, or an ACME round-trip.
      #
      # The tag is PINNED and must stay identical to docker-compose.prod.yml's
      # caddy image — validating against a different Caddy than production runs
      # is validating nothing. Bump both in one commit.
      - name: deploy/Caddyfile is a valid Caddy config
        run: |
          docker run --rm --network none \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile

      # …and the two pins really are the same tag. A drift here is invisible
      # otherwise: both jobs stay green while CI parses the Caddyfile with a
      # parser production does not use.
      - name: The Caddy pin in CI matches the one production runs
        run: |
          # Comment lines are stripped first: docker-compose.prod.yml's comment
          # records which floating tag the pin was taken from, and that is not a
          # second pin.
          ci_tag=$(grep -vE '^[[:space:]]*#' .github/workflows/meta-ci.yml | grep -oE 'caddy:[0-9][0-9A-Za-z._-]*' | sort -u)
          prod_tag=$(grep -vE '^[[:space:]]*#' docker-compose.prod.yml | grep -oE 'caddy:[0-9][0-9A-Za-z._-]*' | sort -u)
          if [ "$ci_tag" != "$prod_tag" ] || [ -z "$prod_tag" ]; then
            echo "::error::caddy image pin drift — meta-ci.yml has '$ci_tag', docker-compose.prod.yml has '$prod_tag'" >&2
            exit 1
          fi
          echo "OK: both pin $prod_tag."

      # The same shape, for the other constant three files agree on by hand.
      # MIN_EMBEDDED_MIGRATE_TAG is the floor below which deploy.sh, rollback.sh
      # and restore.sh refuse a core/search tag, and all three carry their own
      # copy with a "Kept identical in …" comment asking the next editor to
      # remember. Drift here is not cosmetic and it is not loud: an operator who
      # bumped the floor in deploy.sh and not in rollback.sh gets a rollback that
      # accepts a pre-embedded-migrator image, whose main() ignores the one-shot's
      # `migrate up` argv and starts an API server that never exits — so the
      # rollback HANGS, mid-incident, with the broken release still serving.
      # Refusing the tag is the whole point of the constant; a stale copy of it
      # is the same as not having it.
      - name: The embedded-migrator tag floor is identical in all three scripts
        run: |
          # Comments stripped first, exactly as above: all three files explain
          # the constant at length and quote it in their die() messages, and
          # neither is a second declaration.
          values=$(
            for f in deploy/deploy.sh deploy/rollback.sh deploy/restore.sh; do
              v=$(grep -vE '^[[:space:]]*#' "$f" | grep -oE 'MIN_EMBEDDED_MIGRATE_TAG="[^"]+"' | sort -u)
              if [ -z "$v" ]; then
                echo "::error::$f declares no MIN_EMBEDDED_MIGRATE_TAG=\"vX.Y.Z\" — that is the gate that stops a rollback or a restore hanging on an image with no embedded migrator" >&2
                exit 1
              fi
              printf '%s\t%s\n' "$f" "$v"
            done
          ) || exit 1
          distinct=$(printf '%s\n' "$values" | cut -f2 | sort -u)
          if [ "$(printf '%s\n' "$distinct" | wc -l)" -ne 1 ]; then
            echo "::error::MIN_EMBEDDED_MIGRATE_TAG has drifted between the deploy scripts — they must all name the same release:" >&2
            printf '%s\n' "$values" >&2
            exit 1
          fi
          echo "OK: deploy.sh, rollback.sh and restore.sh all floor at $distinct."

      # docker-compose.yml `include:`s ./vidra-core/docker-compose.yml and adds
      # `search`/`search-migrate` services with build context ./vidra-search, so
      # BOTH component repos must be present to resolve the full config. Check them
      # out the same way bootstrap.sh would (public repos, no token needed).
      - name: Check out vidra-core (for compose include)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yegamble/vidra-core
          path: vidra-core
          persist-credentials: false

      - name: Check out vidra-search (for the search service + migrations)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yegamble/vidra-search
          path: vidra-search
          persist-credentials: false

      - name: Check out vidra-user (for bootstrap idempotency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yegamble/vidra-user
          path: vidra-user
          persist-credentials: false

      # The last hand-synced pair in the platform, and the only one that spans
      # two repositories. `scripts/migrate-lint.sh` is the static half of the
      # one-release schema-compat policy: it rejects a destructive statement in
      # any `*.up.sql`, and it is wired into each Go repo's canonical `make ci`.
      # The two copies carry no repo-specific strings PRECISELY so they can stay
      # byte-identical, and wave 4 shipped them with nothing asserting that they
      # do. Neither repo's CI can check it — each sees only itself. This is the
      # only job that has both trees checked out, so this is the only place the
      # check can live.
      #
      # Why it matters that they not diverge: rollback.sh is a 60-second tag flip
      # that never touches the database, and it is only safe because release N-1's
      # code keeps running against release N's schema. If search's copy quietly
      # stops rejecting `DROP COLUMN` while core's still does, half the platform
      # loses the guarantee the rollback path is built on, and nothing anywhere
      # goes red until an operator rolls back across a search migration and finds
      # the previous release cannot read the schema.
      #
      # KNOWN RED UNTIL THE WAVE-4 COMPONENT PRs MERGE. The checkouts above take
      # each component's DEFAULT branch (main), where scripts/migrate-lint.sh does
      # not exist yet — it lives on `prod/phase1-wave4` in both Go repos. This
      # step therefore fails on the wave-5 meta PR by design, exactly as
      # vidra-user's contract-ci does against an unmerged core, and goes green the
      # moment vidra-core and vidra-search land. A missing file is reported as a
      # missing file, not as a difference, so the message says which state it is.
      - name: vidra-core and vidra-search ship the same migrate-lint.sh
        run: |
          core=vidra-core/scripts/migrate-lint.sh
          search=vidra-search/scripts/migrate-lint.sh
          missing=""
          [ -f "$core" ]   || missing="$missing $core"
          [ -f "$search" ] || missing="$missing $search"
          if [ -n "$missing" ]; then
            echo "::error::the schema-compat lint is missing:$missing — both repos must ship scripts/migrate-lint.sh, byte-identical, wired into their own 'make ci'. (Expected while the wave-4 component PRs are unmerged: this job checks out each component's main.)" >&2
            exit 1
          fi
          if ! cmp -s "$core" "$search"; then
            echo "::error::vidra-core and vidra-search carry DIFFERENT scripts/migrate-lint.sh — change one, change the other. They are hand-synced and deliberately free of repo-specific strings so that they can be identical; a divergence means half the platform has stopped enforcing the one-release schema-compat policy that rollback.sh depends on." >&2
            diff -u "$core" "$search" >&2 || true
            exit 1
          fi
          echo "OK: both repos ship the same $(wc -l < "$core" | tr -d ' ')-line migrate-lint.sh."

      # The `core` profile includes postgres/redis/migrate/api + the new search
      # and search-migrate services (build context ./vidra-search). The frontend
      # profile is intentionally NOT activated here; its e2e/contract CI lives in
      # vidra-user. This plain `docker compose`
      # auto-loads docker-compose.override.yml (the api's SEARCH_* wiring).
      - name: Validate full-stack compose resolves
        run: docker compose --profile core config -q

      # Three steps below parse a rendered compose model with PyYAML. It is not
      # guaranteed on the runner image, and a missing import would surface as a
      # traceback rather than as the assertion failing — so install it once, here,
      # before first use.
      - name: Ensure PyYAML is available
        run: python3 -c 'import yaml' 2>/dev/null || pip3 install --quiet pyyaml

      # deploy/cloud-init.yaml.example is pasted into a provider's user-data box
      # and never executed by anything here, so nothing else in this repo would
      # notice it rotting. Both failure modes it has are silent at the far end:
      # cloud-init treats a payload whose first line is not `#cloud-config` as
      # something other than cloud-config and runs NONE of it, and DigitalOcean
      # rejects user-data containing non-ASCII bytes the same quiet way. This
      # repo's prose is full of em dashes and curly quotes; one copied into that
      # file produces a droplet that boots with no provisioning and no error.
      - name: deploy/cloud-init.yaml.example is valid, ASCII cloud-config
        run: |
          python3 - <<'PY'
          import sys, yaml
          path = 'deploy/cloud-init.yaml.example'
          raw = open(path, 'rb').read()
          bad = []
          nonascii = [(i + 1, line) for i, line in enumerate(raw.split(b'\n'))
                      if any(b > 0x7F for b in line)]
          for lineno, line in nonascii:
              bad.append(f'{path}:{lineno} has non-ASCII bytes: {line[:80]!r}')
          if not raw.startswith(b'#cloud-config'):
              bad.append(f'{path} does not start with #cloud-config, so cloud-init would ignore it entirely')
          try:
              doc = yaml.safe_load(raw.decode('ascii', 'replace'))
          except yaml.YAMLError as e:
              bad.append(f'{path} is not parseable YAML: {e}')
              doc = None
          if isinstance(doc, dict):
              for key in ('runcmd', 'users'):
                  if key not in doc:
                      bad.append(f'{path} lost its {key!r} block')
          elif doc is not None:
              bad.append(f'{path} is not a YAML mapping')
          if bad:
              print('::error::deploy/cloud-init.yaml.example would fail silently on a real host')
              print('\n'.join(bad))
              sys.exit(1)
          print('OK: #cloud-config, pure ASCII, parses, and still provisions.')
          PY

      # The explicit -f chain disables override auto-loading, so pass it explicitly
      # exactly as `make dev-hot` (DEV_HOT_COMPOSE) does.
      #
      # `config` alone only proves the chain PARSES. The thing that rots silently
      # is which image each one-shot ends up on: the base file's search-migrate
      # builds the multi-stage RELEASE Dockerfile, so a dev overlay that stopped
      # redirecting it would still render fine while `make dev-hot` recompiled a
      # production image on every run and migrated the dev database with a binary
      # that is not the one being hot-reloaded. Same for `migrate`, which inherits
      # vidra-core's `vidra-core-api:local` when the overlay misses it. Assert the
      # rendered model instead, exactly as the prod one-shot step below does.
      - name: Validate hot-reload overlay compose resolves
        run: |
          docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.dev.yml \
            --profile core config > /tmp/dev-config.yml
          python3 - <<'PY'
          import sys, yaml
          svcs = yaml.safe_load(open('/tmp/dev-config.yml'))['services']
          expected = {'migrate': 'vidra-api-dev', 'search-migrate': 'vidra-search-dev'}
          bad = []
          for name, image in expected.items():
              s = svcs[name]
              if s.get('image') != image:
                  bad.append(f'{name} image is {s.get("image")!r}, not {image!r}')
              dockerfile = (s.get('build') or {}).get('dockerfile')
              if dockerfile != 'Dockerfile.dev':
                  bad.append(f'{name} builds {dockerfile!r}, not Dockerfile.dev')
          if bad:
              print('::error::the hot-reload overlay does not redirect the migration one-shots to the dev images')
              print('\n'.join(bad))
              sys.exit(1)
          print('OK: migrate + search-migrate run the dev images, built from Dockerfile.dev.')
          PY

      # The chain every script that addresses the running stack assembles —
      # deploy/deploy.sh, rollback.sh, restore.sh, backup.sh and the
      # `make prod-config` / `prod-logs` / `prod-down` wrapper — from the single
      # copy in deploy/lib.sh. Spelled out literally HERE, and only here, so this
      # step still fails if lib.sh itself is what regresses.
      #
      # This is the DEFAULT shape (no external datastores, core+frontend), which
      # is what an unedited env/production.env.example selects. Every `${VAR:?}`
      # in it must be satisfied, so dummy values are injected below — that list
      # IS the contract: adding a new required variable to
      # docker-compose.prod.yml without adding it here turns this step red, which
      # is the point.
      #
      # `:?` fails on an EMPTY value too, which is why JWT_SECRET, REDIS_PASSWORD
      # and POSTGRES_PASSWORD must be passed: env/production.env.example
      # deliberately ships them blank so a copied-but-unedited env file fails the
      # render instead of the api's boot.
      #
      # `--profile edge` is part of the deploy shape now: the caddy service moved
      # onto that profile so VIDRA_TLS_MODE=external can leave it out, and
      # deploy/lib.sh appends it for every other mode. Rendering without it here
      # would validate a stack with no TLS terminator in it, which is nobody's
      # production.
      - name: Validate production overlay compose resolves
        env:
          JWT_SECRET: ci-dummy-jwt-secret-not-a-real-secret
          REDIS_PASSWORD: ci-dummy-redis-password
          POSTGRES_PASSWORD: ci-dummy-password
          VIDRA_CORE_TAG: ci-dummy
          VIDRA_USER_TAG: ci-dummy
          VIDRA_SEARCH_TAG: ci-dummy
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            --env-file env/production.env.example \
            --profile core --profile frontend --profile edge config -q

      # THE PROFILE IS THE WHOLE MECHANISM, so it is asserted in both directions
      # and at both levels. One direction alone is worthless: "caddy renders" was
      # true before the profile existed, and "caddy is absent without the profile"
      # is equally true of a caddy service that was deleted by accident.
      #
      # The compose half proves the service is gated. The lib.sh half proves the
      # gate is operated by the ENGINE and not by the operator - if edge_profile()
      # ever stopped emitting `edge` for the ordinary modes, every existing env
      # file (none of which names the profile) would deploy with no TLS
      # terminator, and the compose assertions above would all still pass.
      - name: caddy is in the project unless VIDRA_TLS_MODE=external
        env:
          JWT_SECRET: ci-dummy-jwt-secret-not-a-real-secret
          REDIS_PASSWORD: ci-dummy-redis-password
          POSTGRES_PASSWORD: ci-dummy-password
          VIDRA_CORE_TAG: ci-dummy
          VIDRA_USER_TAG: ci-dummy
          VIDRA_SEARCH_TAG: ci-dummy
        run: |
          render() {
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              --env-file env/production.env.example \
              --profile core --profile frontend "$@" config
          }
          if ! render --profile edge | grep -qE '^  caddy:'; then
            echo "::error::the default deploy shape (--profile edge, which deploy/lib.sh appends for every mode but external) renders WITHOUT the caddy service - every existing deployment would come up with no TLS terminator" >&2
            exit 1
          fi
          if render | grep -qE '^  caddy:'; then
            echo "::error::caddy renders even without the edge profile, so VIDRA_TLS_MODE=external cannot keep it out - it would fight the operator's own proxy for :80 and :443" >&2
            exit 1
          fi

          # The engine's half. Sourced exactly as the deploy scripts source it:
          # ENV_FILE and log() defined first, per deploy/lib.sh's stated contract.
          tmp="$(mktemp -d)"
          fail=0
          for mode in UNSET acme acme-staging internal plain-http external; do
            : > "$tmp/t.env"
            if [ "$mode" != UNSET ]; then
              echo "VIDRA_TLS_MODE=$mode" > "$tmp/t.env"
            fi
            got="$(
              ENV_FILE="$tmp/t.env"
              log() { :; }
              . ./deploy/lib.sh
              edge_profile
            )"
            if [ "$mode" = external ]; then want=""; else want="edge"; fi
            if [ "$got" != "$want" ]; then
              echo "::error::edge_profile() returned '${got}' for VIDRA_TLS_MODE=${mode}, expected '${want}'" >&2
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "OK: caddy renders with the edge profile and not without it, and deploy/lib.sh adds that profile for every mode except external."

      # The overlay's entire security value is that it closes ports, and it does
      # that with `!reset` / `!override` — merge tags that a Compose older than
      # 2.24 IGNORES SILENTLY. The render step above still passes in that case, so
      # assert on the rendered result rather than on a version string.
      #
      # EVERY optional profile is enabled for this render, not just core+frontend.
      # `vidra setup` offers scan/captions/otel as first-class answers and
      # deploy.sh turns them into `--profile` flags, so a droplet really can be
      # running clamd and Jaeger — and their base definitions publish on 0.0.0.0.
      # An assertion that only ever renders core+frontend cannot see that, which
      # is exactly how those four services stayed open. The allow-list below is
      # the whole contract: caddy 80/443, plus the two protocols remote peers dial
      # directly (RTMP ingest 1935, IPFS libp2p swarm 4001). Anything else that
      # wants a host port has to argue for it here first.
      #
      # `edge` is in BOTH renders for a reason that is easy to lose: caddy is the
      # one service in the allow-list that publishes off-host, so a render that
      # omits its profile silently stops checking the only ports that face the
      # internet - and passes, greenly, while proving nothing about them.
      - name: Production overlay actually closes the internal ports
        env:
          JWT_SECRET: ci-dummy-jwt-secret-not-a-real-secret
          REDIS_PASSWORD: ci-dummy-redis-password
          POSTGRES_PASSWORD: ci-dummy-password
          VIDRA_CORE_TAG: ci-dummy
          VIDRA_USER_TAG: ci-dummy
          VIDRA_SEARCH_TAG: ci-dummy
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            --env-file env/production.env.example \
            --profile core --profile frontend --profile edge config > /tmp/prod-config.yml
          docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            --env-file env/production.env.example \
            --profile core --profile frontend --profile edge --profile scan --profile captions \
            --profile otel --profile media --profile ipfs \
            config > /tmp/prod-config-all-profiles.yml
          python3 - <<'PY'
          import sys, yaml
          svcs = yaml.safe_load(open('/tmp/prod-config.yml'))['services']
          allp = yaml.safe_load(open('/tmp/prod-config-all-profiles.yml'))['services']
          bad = []
          for name in ('postgres', 'redis', 'search'):
              published = svcs[name].get('ports') or []
              if published:
                  bad.append(f'{name} still publishes {published}')
          for name in ('api', 'frontend'):
              for p in svcs[name].get('ports') or []:
                  host = p.get('host_ip') if isinstance(p, dict) else p
                  if host not in ('127.0.0.1', '::1'):
                      bad.append(f'{name} publishes on {host!r}, not loopback')
          # Every service in the fully-enabled render, not a hand-kept list: a new
          # optional service with a stray publish must fail here on arrival.
          off_host_ok = {'caddy': {'80', '443'}, 'rtmp': {'1935'}, 'ipfs': {'4001'}}
          for name in sorted(allp):
              for p in allp[name].get('ports') or []:
                  host = p.get('host_ip') if isinstance(p, dict) else None
                  pub = str(p.get('published')) if isinstance(p, dict) else str(p)
                  if host in ('127.0.0.1', '::1'):
                      continue
                  if pub in off_host_ok.get(name, set()):
                      continue
                  bad.append(f'{name} publishes {pub} off-host (host_ip={host!r}) with every profile enabled')
          # The overlay header's own rule: the logging anchor applies to EVERY
          # service, because a service that forgets it gets the daemon default,
          # which is uncapped, on the disk Postgres and the media volume share.
          for name in sorted(allp):
              if 'logging' not in allp[name]:
                  bad.append(f'{name} has no logging cap — it inherits the UNBOUNDED daemon default')
          # And the header's note 3, asserted the same way and for the same
          # reason the log-cap check exists: the overlay claimed
          # `restart: unless-stopped` "everywhere long-lived" while the five
          # optional-profile services had no policy at all, i.e. the compose
          # default `no`. One OOM kill or one reboot and clamav/whisper/otel
          # never come back, silently — uploads stop being scanned and traces
          # stop being exported with nothing failing on the request path.
          # The three one-shots are the deliberate inverse: a restarting
          # migrator is an infinite loop, and api/search wait on it exiting.
          one_shots = {'prep-volumes', 'migrate', 'search-migrate'}
          for name in sorted(allp):
              policy = allp[name].get('restart')
              if name in one_shots:
                  if policy not in (None, 'no'):
                      bad.append(f'{name} is a one-shot but has restart={policy!r} — it would loop forever')
              elif policy != 'unless-stopped':
                  bad.append(f'{name} has restart={policy!r}, not unless-stopped — it will not survive a reboot')
          if bad:
              print('::error::the production overlay is NOT closing the internal ports')
              print('(a Compose older than 2.24 ignores !reset/!override silently)')
              print('\n'.join(bad))
              sys.exit(1)
          print(f'OK: postgres/redis/search publish nothing; api/frontend are loopback-only; '
                f'with scan+captions+otel+media+ipfs enabled, all {len(allp)} services are '
                f'log-capped, every long-lived one restarts unless-stopped (the {len(one_shots)} '
                f'one-shots deliberately do not), and only caddy 80/443, rtmp 1935 and '
                f'ipfs 4001 face the network.')
          PY

      # The migration one-shots are the services deploy.sh runs with `compose run`
      # — which has no `--no-build`, unlike the `up -d --no-build` that starts
      # everything else. So `pull_policy: always` alone cannot stop a
      # cold droplet from COMPILING Go instead of migrating: the `build:` section
      # has to be gone from the rendered model, which is what `build: !reset null`
      # does (and what a Compose older than 2.24 would silently ignore, exactly
      # like the `ports:` resets asserted above).
      - name: Production overlay pins both migration one-shots to published images
        env:
          JWT_SECRET: ci-dummy-jwt-secret-not-a-real-secret
          REDIS_PASSWORD: ci-dummy-redis-password
          POSTGRES_PASSWORD: ci-dummy-password
          VIDRA_CORE_TAG: ci-dummy
          VIDRA_USER_TAG: ci-dummy
          VIDRA_SEARCH_TAG: ci-dummy
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            --env-file env/production.env.example \
            --profile core --profile frontend --profile edge config > /tmp/prod-config.yml
          python3 - <<'PY'
          import sys, yaml
          svcs = yaml.safe_load(open('/tmp/prod-config.yml'))['services']
          expected = {'migrate': 'vidra-core', 'search-migrate': 'vidra-search'}
          bad = []
          for name, repo in expected.items():
              s = svcs[name]
              image = s.get('image') or ''
              if f'/{repo}:' not in image:
                  bad.append(f'{name} image is {image!r}, not a published {repo} tag')
              if 'build' in s:
                  bad.append(f'{name} still carries build: {s["build"]!r} — `compose run` would compile on the host')
              if s.get('pull_policy') != 'always':
                  bad.append(f'{name} pull_policy is {s.get("pull_policy")!r}, not always')
              if 'no-new-privileges:true' not in (s.get('security_opt') or []):
                  bad.append(f'{name} is missing security_opt no-new-privileges:true')
          if bad:
              print('::error::the production overlay does not pin the migration one-shots')
              print('\n'.join(bad))
              sys.exit(1)
          print('OK: migrate + search-migrate pull published images, cannot build, and drop privilege escalation.')
          PY

      # Readiness plan step 1: vidra-core's api `environment:` map is an explicit
      # allow-list and there is no `env_file:` anywhere in the stack, so a key the
      # Go config reads but the map does not pass through is UNSETTABLE — silently,
      # and invisibly to every other gate. That is the class of bug that left
      # JWT_SECRET with no path into the container.
      - name: Every config key vidra-core reads has a compose consumer
        run: |
          docker compose --profile core config > /tmp/base-config.yml
          grep -oE 'getEnv[A-Za-z]*\("[A-Z0-9_]+"' vidra-core/internal/config/config.go \
            | sed 's/.*"\(.*\)"/\1/' | sort -u > /tmp/go-keys.txt
          python3 - <<'PY'
          import sys, yaml
          env = yaml.safe_load(open('/tmp/base-config.yml'))['services']['api'].get('environment') or {}
          go = [k.strip() for k in open('/tmp/go-keys.txt') if k.strip()]
          missing = sorted(k for k in go if k not in env)
          if missing:
              print('::error::config keys read by vidra-core with NO consumer in the rendered api environment:')
              print('\n'.join(missing))
              print('Add them to the api `environment:` map in vidra-core/docker-compose.yml.')
              sys.exit(1)
          print(f'OK: all {len(go)} config keys reach the container ({len(env)} entries in the map).')
          PY

      - name: Exercise bootstrap.sh's idempotent update path
        run: |
          ./bootstrap.sh
          test -d vidra-core/.git
          test -d vidra-search/.git
          test -d vidra-user/.git

  # THE NO-GIT BUNDLE, PROVEN THE ONLY WAY IT CAN BE: by taking the checkouts
  # away and rendering anyway.
  #
  # deploy/make-bundle.sh's entire claim is that a production deploy needs six
  # files out of vidra-core and nothing else - no component checkouts, no git, no
  # migrations directory. That claim is invisible to every other job here,
  # because every other job HAS the checkouts: a bundle missing half its contents
  # renders perfectly in this workspace and fails on the first operator's host.
  # So this job builds the tarball, moves the real checkouts out of the tree, and
  # renders the production matrix from inside the extract - where a forgotten
  # file has nowhere to come from.
  #
  # It is a separate job because it deliberately mutilates its own workspace.
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # vidra-core ONLY. vidra-search and vidra-user are not checked out at all,
      # which is itself part of the assertion: if the rendered production model
      # needed either of them on disk, this job could not pass.
      - name: Check out vidra-core (the bundle's --core input)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yegamble/vidra-core
          path: vidra-core
          persist-credentials: false

      # The exact interface vidra-core's release-assets workflow calls. If these
      # flags change, that workflow breaks in the release it is needed for, which
      # is the worst possible time to find out.
      - name: Build the bundle, twice, and assert the two are identical
        run: |
          ./deploy/make-bundle.sh --core "$GITHUB_WORKSPACE/vidra-core" \
            --tag v0.0.0-ci --out "$RUNNER_TEMP/vidra-bundle_v0.0.0-ci.tar.gz"
          ./deploy/make-bundle.sh --core "$GITHUB_WORKSPACE/vidra-core" \
            --tag v0.0.0-ci --out "$RUNNER_TEMP/second.tar.gz"
          # Reproducibility is not a nicety here: this tarball is a release asset
          # published next to binaries that already have the property, and an
          # asset nobody can rebuild bit-for-bit is an asset nobody can audit.
          # The usual regressions are a stray mtime, the builder's umask, or an
          # unsorted find.
          cmp "$RUNNER_TEMP/vidra-bundle_v0.0.0-ci.tar.gz" "$RUNNER_TEMP/second.tar.gz" \
            || { echo "::error::deploy/make-bundle.sh is not deterministic - two runs from the same commits produced different bytes" >&2; exit 1; }
          echo "OK: byte-identical across runs."

      - name: The manifest's schema version matches the migrations on disk
        run: |
          mkdir -p "$RUNNER_TEMP/tree"
          tar -xzf "$RUNNER_TEMP/vidra-bundle_v0.0.0-ci.tar.gz" -C "$RUNNER_TEMP/tree"
          # Derived FRESHLY here, with the same pipeline deploy.sh uses on a git
          # checkout. deploy.sh trusts this number on a bundle host - it is the
          # independent second opinion it checks the migrator's own ledger
          # against - so a manifest that disagrees with the migrations would turn
          # that check into a coin toss, silently.
          fresh="$(ls -1 vidra-core/migrations/*.up.sql | awk -F/ '{print $NF}' | awk -F_ '{print $1}' | sort -n | tail -1)"
          got="$(sed -n 's/^core_schema_version=//p' "$RUNNER_TEMP/tree/vidra-bundle.manifest")"
          if [ "$fresh" != "$got" ]; then
            echo "::error::vidra-bundle.manifest says core_schema_version=${got}, but vidra-core/migrations tops out at ${fresh}" >&2
            exit 1
          fi
          for key in tag core_schema_version meta_commit core_commit; do
            grep -qE "^${key}=." "$RUNNER_TEMP/tree/vidra-bundle.manifest" \
              || { echo "::error::vidra-bundle.manifest has no ${key}= line - deploy.sh and the release provenance both read it" >&2; exit 1; }
          done
          echo "OK: core_schema_version=${got}, and all four manifest keys are present."

      # The exclusions are as load-bearing as the inclusions. An auto-loaded
      # docker-compose.override.yml in a bundle re-adds build contexts that do
      # not exist there, so every bare `docker compose` in the tree starts
      # failing about a directory nobody asked for; bootstrap.sh in a tree that
      # exists because there is no git is a trap; and a .git anywhere would make
      # deploy.sh take the checkout path on a tree that has no remotes.
      - name: The bundle carries what a deploy needs and none of what it must not
        run: |
          cd "$RUNNER_TEMP/tree"
          bad=""
          for f in docker-compose.yml docker-compose.prod.yml \
                   docker-compose.external-postgres.yml docker-compose.external-redis.yml \
                   env/production.env.example deploy/deploy.sh deploy/rollback.sh \
                   deploy/restore.sh deploy/backup.sh deploy/provision.sh deploy/lib.sh \
                   deploy/compose.sh deploy/Caddyfile deploy/README.md \
                   deploy/cloud-init.yaml.example deploy/vidra-backup.service \
                   deploy/vidra-backup.timer vidra-bundle.manifest \
                   vidra-core/docker-compose.yml; do
            [ -f "$f" ] || bad="${bad} MISSING:${f}"
          done
          # Explicit `if`s, not `[ … ] && bad=…`: under `bash -e` (the default
          # shell here) a failing AND-list is a failing command, so the spelling
          # that reads better would kill the step on the first file that is
          # correctly absent.
          for f in bootstrap.sh docker-compose.override.yml docker-compose.dev.yml; do
            if [ -e "$f" ]; then bad="${bad} PRESENT:${f}"; fi
          done
          if [ -d .git ]; then bad="${bad} PRESENT:.git"; fi
          # Every path vidra-core's compose file bind-mounts. A missing one is
          # created by Docker as an empty DIRECTORY and the container crash-loops
          # on it - on the operator's host, at `up -d`, with nothing in this
          # repository having noticed.
          while IFS= read -r m; do
            [ -f "vidra-core/$m" ] || bad="${bad} MISSING-MOUNT:vidra-core/${m}"
          done <<EOF
          $(grep -oE '^[[:space:]]*-[[:space:]]*\./[^:]+:' vidra-core/docker-compose.yml | sed -e 's/^[[:space:]]*-[[:space:]]*\.\///' -e 's/:$//' | sort -u)
          EOF
          if [ -n "$bad" ]; then
            echo "::error::the bundle's contents are wrong:${bad}" >&2
            exit 1
          fi
          echo "OK: the deployment tree is complete and carries no bootstrap.sh, no override/dev overlay and no .git."

      # deploy.sh and rollback.sh branch on this and nothing else. If it answered
      # `false` here they would run the checkout-sync loop on a tree with no .git
      # and die - the exact failure the bundle exists to remove.
      - name: deploy/lib.sh recognises the extracted tree as a bundle
        run: |
          cd "$RUNNER_TEMP/tree"
          ENV_FILE=env/production.env.example
          log() { :; }
          . ./deploy/lib.sh
          if ! is_bundle_tree "$PWD"; then
            echo "::error::is_bundle_tree() says the extracted bundle is not a bundle - deploy.sh would take the git path on it and die" >&2
            exit 1
          fi
          if is_bundle_tree "$GITHUB_WORKSPACE"; then
            echo "::error::is_bundle_tree() says this git checkout IS a bundle - deploy.sh would skip the checkout sync on a tree that needs it" >&2
            exit 1
          fi
          echo "OK: bundle tree yes, git checkout no; manifest tag=$(bundle_manifest_get "$PWD" tag)."

      # THE ACTUAL PROOF. The checkout is moved away first, so nothing below can
      # be resolving a path out of the workspace by accident.
      - name: Render the production matrix from inside the bundle, with no checkouts on disk
        env:
          JWT_SECRET: ci-dummy-jwt-secret-not-a-real-secret
          REDIS_PASSWORD: ci-dummy-redis-password
          POSTGRES_PASSWORD: ci-dummy-password
          VIDRA_CORE_TAG: ci-dummy
          VIDRA_USER_TAG: ci-dummy
          VIDRA_SEARCH_TAG: ci-dummy
          DATABASE_URL: postgres://vidra:ci-dummy-password@db.ci.invalid:5432/vidra?sslmode=require
          REDIS_URL: redis://:ci-dummy-redis-password@cache.ci.invalid:6379/0
          SEARCH_REDIS_URL: redis://:ci-dummy-redis-password@cache.ci.invalid:6379/1
        run: |
          mv "$GITHUB_WORKSPACE/vidra-core" "$RUNNER_TEMP/vidra-core-moved-away"
          cd "$RUNNER_TEMP/tree"
          render() {
            what="$1"; shift
            if ! docker compose -f docker-compose.yml -f docker-compose.prod.yml "$@" \
                 --env-file env/production.env.example config -q; then
              echo "::error::the ${what} render fails inside an unpacked bundle - a deployment host would get this instead of a stack" >&2
              exit 1
            fi
            echo "  OK: ${what}"
          }
          render "default deploy (core+frontend+edge)" --profile core --profile frontend --profile edge
          render "external TLS (core+frontend, no edge)" --profile core --profile frontend
          render "every optional profile" --profile core --profile frontend --profile edge \
            --profile scan --profile captions --profile otel --profile media --profile ipfs
          render "external Postgres" -f docker-compose.external-postgres.yml \
            --profile core --profile frontend --profile edge
          render "external Redis" -f docker-compose.external-redis.yml \
            --profile core --profile frontend --profile edge
          render "both external datastores" -f docker-compose.external-postgres.yml \
            -f docker-compose.external-redis.yml --profile core --profile frontend --profile edge
          echo "OK: every production shape renders from a tree with no component checkouts anywhere."

  # Readiness plan step 2's "Verify": render a template with dummy secrets, boot
  # the api in PRODUCTION mode, and assert /readyz 200. Separate job because it
  # compiles vidra-core, and the `validate` job above must stay fast.
  #
  # What this actually proves, and nothing else does: that every value the api
  # needs in production mode has a path from an env file, through compose
  # substitution, into the container, and past `config.validate()`. That is the
  # exact failure JWT_SECRET had — invisible to `config -q`, invisible to every
  # sub-repo's CI, visible only at boot. Its last step proves the same class of
  # thing for the schema: that BOTH migration one-shots really do apply their
  # migrations from the service image (`migrate up`), which `config -q` can only
  # assume.
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out vidra-core (build context + compose include)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yegamble/vidra-core
          path: vidra-core
          persist-credentials: false

      - name: Check out vidra-search (for the search service + migrations)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yegamble/vidra-search
          path: vidra-search
          persist-credentials: false

      # Not built here, but docker-compose.yml declares its build context, so the
      # directory has to exist for the model to load.
      - name: Check out vidra-user (frontend build context)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yegamble/vidra-user
          path: vidra-user
          persist-credentials: false

      # Dummy secrets, real shapes. Deliberately NOT env/production.env.example
      # verbatim: that template ships blank/`<generate: …>` placeholders for the
      # secrets and Spaces keys, so it cannot boot until an operator edits it —
      # which is the intended UX, not a defect. What is under test here is the
      # plumbing, so the externals it would otherwise need (S3, SMTP, ClamAV) are
      # switched off and everything else is production.
      #
      # The search integration is off because SEARCH_SERVICE_URL is unset here and
      # the compose default is empty — but ONLY as long as every compose call
      # below passes an explicit `-f docker-compose.yml`. A bare `docker compose`
      # auto-loads docker-compose.override.yml, which forces RATE_LIMIT_ENABLED
      # false and injects the dev SEARCH_SERVICE_URL + SEARCH_INTERNAL_SECRET; the
      # api would then boot in a hybrid dev/production config and this job would
      # prove less than it claims. The explicit `-f` is the same thing production
      # does, for the same reason (see deploy/README.md).
      - name: Write a bootable production env file
        run: |
          cat > env/ci-boot.env <<EOF
          VIDRA_ENV=production
          HTTP_PORT=8099
          PUBLIC_BASE_URL=https://ci.example.invalid
          CORS_ALLOWED_ORIGINS=https://ci.example.invalid
          JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')
          MFA_KEY_KEK=$(openssl rand -base64 32 | tr -d '\n')
          POSTGRES_USER=vidra
          POSTGRES_PASSWORD=ci-dummy-password
          POSTGRES_DB=vidra
          STORAGE_BACKEND=local
          MAIL_ENABLED=false
          MALWARE_SCAN_ENABLED=false
          FEDERATION_ENABLED=false
          TRANSCODING_ENABLED=false
          REGISTRATION_ENABLED=false
          METRICS_ENABLED=true
          LOG_FORMAT=json
          EOF

      # `up api` (not the whole profile) starts exactly postgres, redis, migrate
      # and api via depends_on — the search service is not part of what this job
      # is testing and building it too would double the job's runtime.
      - name: Boot the api in production mode
        run: docker compose -f docker-compose.yml --env-file env/ci-boot.env --profile core up -d --build api

      - name: /readyz returns 200
        run: |
          for _ in $(seq 1 40); do
            if curl -fsS -m 5 http://127.0.0.1:8099/readyz; then
              echo
              echo "OK: the api booted with VIDRA_ENV=production and /readyz is 200."
              exit 0
            fi
            sleep 3
          done
          echo "::error::the api never became ready" >&2
          docker compose -f docker-compose.yml --env-file env/ci-boot.env --profile core logs --tail=100 api >&2
          exit 1

      # THE MERGE-ORDER CONTRACT, EXECUTED. Both one-shots run `migrate up` on
      # their own SERVICE image, so a component release whose binary predates the
      # embedded subcommand does not fail here — it ignores the argv, starts an
      # API server and never exits (which is why deploy.sh/rollback.sh gate on
      # MIN_EMBEDDED_MIGRATE_TAG, and why vidra-core + vidra-search must release
      # BEFORE this meta revision lands; see deploy/README.md "Upgrade notes").
      # `up api` above already runs `migrate` as a depends_on edge, but nothing
      # covered `search-migrate` at all, and nothing exercised the repeated-argv
      # form the runbook documents. This step is the whole contract, run for real
      # against the throwaway postgres — a hang here fails the job on timeout,
      # which is the intended signal.
      - name: Both migration one-shots run from their service images
        run: |
          COMPOSE=(docker compose -f docker-compose.yml --env-file env/ci-boot.env --profile core)
          # The search one-shot owns a build context, so build it here — the api
          # step above did not touch it. The core one-shot deliberately gets NO
          # `--build`: it shares the api's `vidra-core-api:local` image and
          # carries no build section of its own (api is the single producer), so
          # `run --build migrate` makes Compose try to PULL that local-only tag
          # and the step dies with "pull access denied". Verified, not assumed.
          "${COMPOSE[@]}" build search-migrate
          # Idempotent re-run for core (the api's depends_on edge already applied
          # it); first and only run for search.
          "${COMPOSE[@]}" run --rm migrate
          "${COMPOSE[@]}" run --rm search-migrate
          # `compose run` REPLACES the service command, so the subcommand is
          # repeated — the exact shape deploy/README.md's recovery steps use.
          # Both exit non-zero on a dirty ledger, so this also asserts clean.
          "${COMPOSE[@]}" run --rm migrate        migrate version
          "${COMPOSE[@]}" run --rm search-migrate migrate version
          # Independent second opinion: the two ledger tables the binaries carry
          # compiled-in (no x-migrations-table URL param anywhere) really exist.
          "${COMPOSE[@]}" exec -T postgres psql -U vidra -d vidra \
            -c 'SELECT version, dirty FROM schema_migrations;' \
            -c 'SELECT version, dirty FROM vidra_search_migrations;'
          echo "OK: core + search schemas applied by the service images themselves."

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml --env-file env/ci-boot.env --profile core down -v
