# Full local stack for Vidra.
#
# Brings up the vidra-core backend (postgres, redis, migrate, api) by INCLUDING
# vidra-core's own compose file, so this stays a thin wrapper with the backend
# definition living in exactly one place (vidra-core/docker-compose.yml). All of
# vidra-core's profiles (core, storage, ...) work from here unchanged.
#
# Run ./bootstrap.sh first so ./vidra-core and ./vidra-user exist, then:
#
#   make dev            # backend stack up; frontend via `npm run dev` for HMR
#   make up             # backend stack + the containerised frontend (:3000)
#
# or raw compose:
#   docker compose --profile core up --build
#   docker compose --profile core --profile frontend up --build
#
# Environments: pass one of the env templates (see .ralph/specs/environments.md):
#   docker compose --env-file env/local.env --profile core --profile frontend up -d
#
# NOTE: the browser-facing API origin is resolved at RUNTIME — the frontend
# server injects PUBLIC_API_BASE_URL per request (vidra-user lib/config.ts +
# app/runtime-config.js), so changing it only needs a restart. The
# NEXT_PUBLIC_API_BASE_URL build arg below remains solely for images built from
# older vidra-user code, which baked the origin into the client bundle.
include:
  - path: ./vidra-core/docker-compose.yml
    # env_file: /dev/null is LOAD-BEARING, not decoration.
    #
    # Compose resolves an included model's ${VAR} substitutions against the .env
    # file in the INCLUDED file's own directory — i.e. `vidra-core/.env`, which
    # vidra-core's README tells its developers to create (`cp .env.example .env`).
    # That file sets DATABASE_URL=...@localhost:5432..., REDIS_URL=...@localhost...,
    # POSTGRES_PASSWORD=vidra and JWT_SECRET=<the dev constant>, and it takes
    # precedence over this repo's `--env-file env/production.env`.
    #
    # The result, if it is left to load: the api and the migrate one-shot are
    # handed a `localhost` DSN (nothing listens there inside the container, so
    # both fail), the real POSTGRES_PASSWORD is ignored, and JWT_SECRET silently
    # becomes the dev value that production hard-rejects at boot. It also breaks
    # plain `make dev` on any machine that happens to have vidra-core/.env.
    #
    # Pointing env_file at an empty file makes the included model resolve against
    # the env file this repo was invoked with, and nothing else. /dev/null is used
    # because Compose ERRORS on a missing env_file path (so an empty list or a
    # non-existent placeholder will not do) and because adding a tracked empty file
    # just to satisfy this would be worse. Verify with:
    #   docker compose --env-file env/production.env --profile core config \
    #     | grep -E 'DATABASE_URL|REDIS_URL'
    # — every DSN must name the compose services `postgres` / `redis`.
    env_file: /dev/null

services:
  # The api service is DEFINED in the included vidra-core/docker-compose.yml. It is
  # EXTENDED with the vidra-search wiring (SEARCH_SERVICE_URL + SEARCH_INTERNAL_SECRET)
  # in docker-compose.override.yml — NOT here — because redeclaring an included
  # service inside the SAME file that `include:`s it is rejected by some Compose
  # versions ("services.api conflicts with imported resource"). The override file is
  # auto-loaded by every plain `docker compose` command; see its header for details.
  frontend:
    profiles: ["frontend"]
    build:
      context: ./vidra-user
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # Browser-facing API origin, read at RUNTIME by the frontend server (a
      # restart applies a change; no rebuild). It MUST stay set here: the local
      # `make up` topology is cross-origin — frontend on :3000, api on :8080 —
      # so same-origin relative URLs (the unset default) would 404. Production
      # is the opposite case: docker-compose.prod.yml serves both behind Caddy
      # on ONE origin and deliberately relies on the env file leaving
      # NEXT_PUBLIC_API_BASE_URL pointed at that same origin.
      PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      # Server Components call the API over compose DNS; the browser keeps
      # using PUBLIC_API_BASE_URL through the host-published port.
      INTERNAL_API_BASE_URL: http://api:8080
      # Server-side log verbosity (lib/logger.ts:62). Same name, semantics and
      # default as the api and search services, so one ${LOG_LEVEL} in the env
      # file sets all three consistently.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # OpenTelemetry for the Next.js server runtime (instrumentation.ts:15,
      # lib/config.ts:24-35). Opt-in and genuinely zero-cost when off — the SDK
      # is never imported unless OTEL_ENABLED is the literal string "true".
      # The endpoint/protocol are SHARED with the api on purpose (one collector),
      # but the service name is NOT: FRONTEND_OTEL_SERVICE_NAME keeps frontend
      # spans distinguishable from the api's ${OTEL_SERVICE_NAME:-vidra-core}.
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${FRONTEND_OTEL_SERVICE_NAME:-vidra-user}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
    depends_on:
      api:
        # service_healthy, not service_started: the frontend server-renders its
        # first pages against INTERNAL_API_BASE_URL, and an api that is merely
        # "started" is still running migrations/boot wiring. The api image bakes
        # a HEALTHCHECK (vidra-core/Dockerfile:41-42 -> /healthz); the prod
        # overlay replaces it with a stricter /readyz probe.
        condition: service_healthy
    restart: unless-stopped

  # One-shot search-schema migration, run by the SEARCH IMAGE ITSELF: the
  # migrations are compiled into the vidra-search binary, so there is no
  # golang-migrate CLI image and no bind-mounted ./vidra-search/migrations —
  # applying the schema no longer needs a git checkout of the SQL files, and the
  # migrator can no longer drift from the binary that expects them.
  # Joins the `core` profile so `make dev`/`dev-hot` run it.
  #
  # vidra-search shares the core `vidra` database but lives in its own `search`
  # schema (migration 0001 creates it), and its version ledger stays
  # `vidra_search_migrations` (in public) so it never collides with core's
  # `schema_migrations`. That name is now COMPILED IN (vidra-search
  # internal/dbmigrate) instead of riding along as an `x-migrations-table` URL
  # parameter — which is exactly why this service can read the same
  # ${DATABASE_URL} as the api and the search service and needs no DSN variable
  # of its own. An inherited DSN that still carries
  # &x-migrations-table=vidra_search_migrations is accepted (the binary strips
  # it); one naming a DIFFERENT table is refused rather than silently ignored.
  search-migrate:
    build: ./vidra-search
    profiles: ["core"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-vidra}:${POSTGRES_PASSWORD:-vidra}@postgres:5432/${POSTGRES_DB:-vidra}?sslmode=disable}
    # Applies all pending migrations and exits: 0 when the schema is current
    # (including "nothing to do"), non-zero on any failure or a dirty ledger, so
    # the search service's `service_completed_successfully` dependency and
    # deploy.sh's exit-code-gated `run --rm search-migrate` gate on it exactly as
    # before.
    #
    # To read the ledger without changing it, note that `compose run` REPLACES
    # this command instead of appending to it — the subcommand must be repeated:
    #   docker compose run --rm search-migrate migrate version
    # (`run --rm search-migrate version` alone would pass "version" as argv[1],
    # which the binary refuses rather than treating as a server start.)
    command: ["migrate", "up"]

  # vidra-search: internal autosuggest / search / recommendations service. Only
  # vidra-core talks to it (HMAC S2S); it is NEVER exposed to the browser. Shares
  # the core Postgres (schema `search`) and Redis (DB index 1). Env mirrors the
  # api service style: VIDRA_ENV overridable, HTTP_PORT fixed to the in-container
  # 8080. Compose has no wildcard passthrough, so every key vidra-search's
  # internal/config/config.go reads needs an explicit line here — anything absent
  # is simply unreachable from the env file. Each default below is the SAME value
  # the service would pick on its own, so this map changes nothing until an
  # operator overrides something.
  #
  # Naming note: vidra-search reads several key names that vidra-core also reads
  # (HTTP_HOST, HTTP_*_TIMEOUT, HTTP_BODY_LIMIT) but with DIFFERENT defaults
  # (request timeout 10s vs core's 30s; body limit 2M vs core's 8M). Those are
  # deliberately fed from SEARCH_-prefixed substitution variables so that raising
  # core's upload deadline does not silently retune the search service. LOG_LEVEL,
  # LOG_FORMAT and METRICS_ENABLED do share one variable across all three services
  # — identical semantics and identical defaults, so one knob is correct there.
  search:
    build: ./vidra-search
    profiles: ["core"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      search-migrate:
        condition: service_completed_successfully
    environment:
      VIDRA_ENV: ${VIDRA_ENV:-development}
      HTTP_PORT: "8080"
      # Same DSN as the api: vidra-search lives in the `search` schema of the
      # core database, so one ${DATABASE_URL} (and one pg_dump) covers both.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-vidra}:${POSTGRES_PASSWORD:-vidra}@postgres:5432/${POSTGRES_DB:-vidra}?sslmode=disable}
      # Redis DB index 1 — core uses 0. Do NOT feed this from ${REDIS_URL}: that
      # variable carries core's /0 and the two services would share a keyspace.
      REDIS_URL: ${SEARCH_REDIS_URL:-redis://redis:6379/1}
      # Shared HMAC secret for core↔search auth. Compose-local dev default ONLY;
      # a real deployment sets a strong (>=32 byte) value and never commits it.
      # MUST match the api service's SEARCH_INTERNAL_SECRET above.
      INTERNAL_SECRET: ${SEARCH_INTERNAL_SECRET:-dev-insecure-internal-secret-change-me-0000}
      # Logging / metrics. Shared with api + frontend (same names, same defaults).
      # vidra-search's /metrics is only reachable over the compose network (the
      # prod overlay sets `ports: []`), so enabling it here publishes nothing.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      # HTTP server shape. SEARCH_-prefixed substitution vars (see the note above)
      # so these stay independent of core's identically-named knobs.
      HTTP_HOST: ${SEARCH_HTTP_HOST:-0.0.0.0}
      HTTP_READ_TIMEOUT: ${SEARCH_HTTP_READ_TIMEOUT:-15s}
      HTTP_WRITE_TIMEOUT: ${SEARCH_HTTP_WRITE_TIMEOUT:-30s}
      HTTP_SHUTDOWN_TIMEOUT: ${SEARCH_HTTP_SHUTDOWN_TIMEOUT:-20s}
      HTTP_REQUEST_TIMEOUT: ${SEARCH_HTTP_REQUEST_TIMEOUT:-10s}
      HTTP_BODY_LIMIT: ${SEARCH_HTTP_BODY_LIMIT:-2M}
      # Event pipeline retention + the ranking-model directory. MODEL_DIR is
      # backed by the `search_models` named volume in docker-compose.prod.yml;
      # without it, trained models are lost on every container replacement and
      # simply get rebuilt by the model-loader job.
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-90}
      MODEL_DIR: ${MODEL_DIR:-/var/lib/vidra-search/models}
      # Privacy floor for suggestions: a query is only ever suggested once this
      # many DISTINCT users have issued it. Lowering it below 3 leaks individual
      # search behaviour into a public surface.
      MIN_QUERY_USER_COUNT: ${MIN_QUERY_USER_COUNT:-3}
      # What counts as a "watched" signal for ranking/trending.
      MEANINGFUL_WATCH_SECONDS: ${MEANINGFUL_WATCH_SECONDS:-30}
      MEANINGFUL_WATCH_PCT: ${MEANINGFUL_WATCH_PCT:-30}
      TRENDING_HALF_LIFE_HOURS: ${TRENDING_HALF_LIFE_HOURS:-6}
      # Background worker fleet. SEARCH_WORKERS_ENABLED=false turns this
      # container into a pure read replica; SEARCH_RUN_JOB="<name>" makes it run
      # exactly one job and exit (used for one-shot backfills, not for serving).
      SEARCH_WORKERS_ENABLED: ${SEARCH_WORKERS_ENABLED:-true}
      SEARCH_RUN_JOB: ${SEARCH_RUN_JOB:-}
      SEARCH_TREND_CAP_WINDOW: ${SEARCH_TREND_CAP_WINDOW:-1h}
      SEARCH_AGGREGATES_INTERVAL: ${SEARCH_AGGREGATES_INTERVAL:-1m}
      SEARCH_ENGAGEMENT_INTERVAL: ${SEARCH_ENGAGEMENT_INTERVAL:-5m}
      SEARCH_SESSIONIZER_INTERVAL: ${SEARCH_SESSIONIZER_INTERVAL:-5m}
      SEARCH_TRENDING_INTERVAL: ${SEARCH_TRENDING_INTERVAL:-1m}
      SEARCH_COVIS_INTERVAL: ${SEARCH_COVIS_INTERVAL:-15m}
      SEARCH_RETENTION_INTERVAL: ${SEARCH_RETENTION_INTERVAL:-24h}
      SEARCH_RECONCILE_GUARD_INTERVAL: ${SEARCH_RECONCILE_GUARD_INTERVAL:-10m}
      SEARCH_MODEL_LOADER_INTERVAL: ${SEARCH_MODEL_LOADER_INTERVAL:-1m}
      SEARCH_SHADOW_EVAL_INTERVAL: ${SEARCH_SHADOW_EVAL_INTERVAL:-1h}
      SEARCH_SHADOW_EVAL_DAYS: ${SEARCH_SHADOW_EVAL_DAYS:-14}
      # Ranking tunables. Change these only with a shadow-eval to compare against.
      SEARCH_QUERY_HALF_LIFE_HOURS: ${SEARCH_QUERY_HALF_LIFE_HOURS:-168}
      SEARCH_WATCH_HALF_LIFE_HOURS: ${SEARCH_WATCH_HALF_LIFE_HOURS:-720}
      SEARCH_TRENDING_WILSON_FLOOR: ${SEARCH_TRENDING_WILSON_FLOOR:-0.10}
      SEARCH_COVIS_WINDOW_SECONDS: ${SEARCH_COVIS_WINDOW_SECONDS:-3600}
      SEARCH_COVIS_LAMBDA: ${SEARCH_COVIS_LAMBDA:-10}
      SEARCH_COVIS_TOP_M: ${SEARCH_COVIS_TOP_M:-100}
    # Local inspection only. docker-compose.prod.yml removes this publish with
    # `ports: !reset []` — nothing off the compose network may reach the search
    # service. It has to be `!reset`: Compose MERGES sequence fields across a -f
    # chain, so a plain `ports: []` in the overlay appends nothing and the
    # mapping below would survive into production. (`!reset` needs Compose
    # >= 2.24; deploy/{deploy,rollback,restore}.sh refuse to run on older.)
    ports:
      - "${SEARCH_HTTP_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
