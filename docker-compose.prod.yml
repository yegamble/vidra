# PRODUCTION OVERLAY — never used alone, and never auto-loaded.
#
# Apply it on top of the base file with an EXPLICIT -f chain:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file env/production.env --profile core --profile frontend pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file env/production.env --profile core --profile frontend up -d --no-build
#
# (= what deploy/deploy.sh runs). An explicit -f chain DISABLES auto-loading of
# docker-compose.override.yml — which is exactly what production wants, because
# that file carries local-development defaults (RATE_LIMIT_ENABLED=false above
# all). The one thing it also carries is the api's SEARCH_SERVICE_URL /
# SEARCH_INTERNAL_SECRET wiring, so production MUST set SEARCH_SERVICE_URL
# (=http://search:8080) and SEARCH_INTERNAL_SECRET in env/production.env or the
# search integration silently degrades to local SQL. See deploy/README.md.
#
# What this file changes versus the dev stack, and why:
#   1. Nothing but Caddy is reachable from off-host. postgres/redis/search and
#      the optional-profile services (clamav, whisper, otel-collector, jaeger)
#      lose their published ports entirely; api and frontend publish on
#      127.0.0.1 only. This is the ONLY firewall that actually works: Docker
#      installs its DOCKER-USER iptables rules AHEAD of ufw, so a host firewall
#      does not filter published container ports. (The same technique is already
#      used for the IPFS RPC ports in vidra-core/docker-compose.yml.) The two
#      DELIBERATE exceptions are the RTMP ingest port 1935 (`media` profile) and
#      the IPFS libp2p swarm port 4001 (`ipfs` profile): both are protocols
#      remote peers dial directly, so they stay published and are gated in the
#      cloud firewall instead.
#   2. Images are PULLED from GHCR by immutable tag instead of built on the box.
#   3. restart: unless-stopped everywhere long-lived, so a reboot returns the
#      stack unattended. Requires `systemctl enable --now docker` on the host.
#   4. Capped json-file logging on every service — the daemon default is
#      UNBOUNDED, and the api emits a JSON line per request onto the same disk
#      as Postgres and the media volume.
#   5. Named volumes for everything that must survive `up -d`, including Caddy's
#      ACME account+certificates (re-issuing on every deploy hits Let's Encrypt
#      rate limits fast).
#   6. A Caddy TLS terminator that does single-origin path routing (deploy/Caddyfile).

# Capped container logs. Anchored once and applied to every service below; a
# service that forgets it inherits the daemon default, which is uncapped.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ---------------------------------------------------------------------------
  # One-shot volume preparation. MUST run before api/search.
  #
  # WHY THIS EXISTS: all three application images run as non-root uid 10001
  # (vidra-core/Dockerfile:39,56 and vidra-search/Dockerfile:17,19). Docker
  # creates a named volume's mount point owned by root:root 0755 whenever that
  # path does NOT already exist inside the image — and /app/data, /scratch and
  # /var/lib/vidra-search/models do not. Verified empirically: without this
  # service the api gets "permission denied" on the very first os.MkdirTemp in
  # /scratch (every transcode fails) and on creating STORAGE_LOCAL_ROOT.
  #
  # Idempotent and non-recursive on purpose: it only fixes the mount points, so
  # it stays instant even once the media volume is large. Content created later
  # is already owned by uid 10001.
  #
  # live_hls is deliberately NOT touched: the api only READS it, and the
  # `media`-profile rtmp server writes it as its own user.
  prep-volumes:
    image: alpine:3.24
    profiles: ["core"]
    restart: "no"
    logging: *logging
    user: "0:0"
    command:
      - "sh"
      - "-euc"
      - |
        mkdir -p /app/data/media /scratch /var/lib/vidra-search/models
        chown 10001:10001 /app/data /app/data/media /scratch /var/lib/vidra-search/models
        chmod 0750 /app/data /app/data/media /scratch /var/lib/vidra-search/models
    volumes:
      - media_data:/app/data
      - transcode_tmp:/scratch
      - search_models:/var/lib/vidra-search/models

  postgres:
    # Nothing off the compose network needs Postgres. `!reset` is REQUIRED here:
    # Compose MERGES sequence fields across a -f chain, so a plain `ports: []`
    # appends nothing and the base file's 0.0.0.0:5432 publish survives (verified
    # with `config`). `!reset` is what actually closes the port — after bring-up,
    # `nmap -Pn -p 5432 <droplet>` must report closed or this overlay is not
    # being applied. Needs Compose >= 2.24; see deploy/README.md prerequisites.
    ports: !reset []
    restart: unless-stopped
    logging: *logging
    # Tuning defaults are sized for the plan's PUBLIC-LAUNCH droplet (8 vCPU /
    # 16 GB). On the 4 vCPU / 8 GB floor droplet set
    # POSTGRES_SHARED_BUFFERS=512MB and POSTGRES_EFFECTIVE_CACHE_SIZE=3GB in the
    # env file, otherwise Postgres reserves memory the api + ffmpeg need.
    # effective_cache_size is a planner hint only; it allocates nothing.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-2GB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-6GB}"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-100}"
    environment:
      # Same assertion pattern as the api's JWT_SECRET below. The base file
      # deliberately declares `POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vidra}`
      # (vidra-core/docker-compose.yml) because dev flows render with no env
      # file at all — but left alone in production, an env file that omits or
      # blanks the key silently ships the dev default `vidra` as the database
      # password. `:?` fails the RENDER on an empty value as well as an unset
      # one, and it binds here — in this overlay only — so no dev flow ever
      # sees it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production (openssl rand -hex 32 - hex not base64, because the value is substituted into a postgres:// DSN); on a host with an EXISTING database volume set the database's CURRENT password - the value only initializes a fresh volume, see deploy/README.md}

  redis:
    # `!reset`, not `[]` — see the postgres note above.
    ports: !reset []
    restart: unless-stopped
    logging: *logging
    # Redis holds nothing durable (cache + rate-limit/dedup counters), so
    # persistence is off on purpose: no RDB snapshots, no AOF, and a hard
    # 256 MB ceiling with LRU eviction rather than an OOM kill.
    #
    # requirepass is NOT optional here — an unauthenticated Redis on a shared
    # bridge network is a remote-code-execution primitive. Because this changes
    # the DSN shape, the api and search REDIS_URL values are rewritten below to
    # carry the password; do not set REDIS_URL/SEARCH_REDIS_URL by hand unless
    # you include the credentials yourself.
    command:
      - "redis-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required in production (openssl rand -hex 32 - hex not base64, because the value is substituted into a redis:// DSN)}"
      - "--maxmemory"
      - "${REDIS_MAXMEMORY:-256mb}"
      - "--maxmemory-policy"
      - "allkeys-lru"
    healthcheck:
      # The base healthcheck runs a bare `redis-cli ping`, which returns NOAUTH
      # once requirepass is set — the container would never become healthy and
      # api/search would wait forever on their service_healthy dependency.
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required in production (openssl rand -hex 32 - hex not base64, because the value is substituted into a redis:// DSN)}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Both migration one-shots run the RELEASE image of the service whose schema
  # they own — the migrations are compiled into those binaries, so `migrate up`
  # is a command on the api / search image rather than a third-party CLI. The
  # base file declares `build:` for them (the dev definition), so they need the
  # same image + `pull_policy: always` pin as api/search/frontend below, PLUS a
  # `build: !reset null` the long-lived services do not need:
  #
  # deploy/deploy.sh runs these two as discrete, exit-code-gated `run --rm` steps
  # BEFORE `up -d --no-build` — and `docker compose run` has no `--no-build` flag
  # of its own. With a `build:` section still merged in from the base file, a cold
  # image cache makes `run` COMPILE (`pull_policy` is not consulted for a service
  # Compose considers buildable), which on a droplet means an OOM instead of a
  # migration, from a source checkout production is not even guaranteed to have.
  # `!reset` deletes the inherited mapping outright — a plain `build: null` would
  # be merged, not replaced. Needs Compose >= 2.24, same floor as the `ports:`
  # resets above; `deploy/{deploy,rollback,restore}.sh` refuse to run below it.
  #
  # Verify after any change to this block (both must hold):
  #   make prod-config          # or the meta-ci "production overlay" step
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml … config \
  #     | python3 -c '…'        # migrate/search-migrate: image set, build absent
  #
  # The tags come from the SAME variables as the services, which is what keeps
  # schema and code versions identical. Tag FLOOR: an image published before the
  # embedded `migrate` subcommand existed ignores the argv and boots an API
  # SERVER here, so the one-shot never exits and the deploy hangs — the
  # MIN_EMBEDDED_MIGRATE_TAG gate in deploy/{deploy,rollback,restore}.sh refuses
  # those tags before anything runs.
  migrate:
    image: ghcr.io/${VIDRA_IMAGE_OWNER:-yegamble}/vidra-core:${VIDRA_CORE_TAG:?VIDRA_CORE_TAG is required (e.g. v0.1.0) so deploys and rollbacks are reproducible}
    pull_policy: always
    build: !reset null
    logging: *logging
    # Hardening parity with api/search/frontend: this one-shot connects to the
    # production database with the same image and privileges the api has, so it
    # gets the same setuid/setgid escalation block.
    security_opt:
      - "no-new-privileges:true"

  search-migrate:
    image: ghcr.io/${VIDRA_IMAGE_OWNER:-yegamble}/vidra-search:${VIDRA_SEARCH_TAG:?VIDRA_SEARCH_TAG is required (e.g. v0.1.0) so deploys and rollbacks are reproducible}
    pull_policy: always
    build: !reset null
    logging: *logging
    security_opt:
      - "no-new-privileges:true"

  api:
    # Pull the release image instead of building on the droplet. The base file
    # still declares `build:` (it is the dev definition); `pull_policy: always`
    # plus `up -d --no-build` guarantees the registry image wins and the droplet
    # never compiles Go or runs `next build`.
    image: ghcr.io/${VIDRA_IMAGE_OWNER:-yegamble}/vidra-core:${VIDRA_CORE_TAG:?VIDRA_CORE_TAG is required (e.g. v0.1.0) so deploys and rollbacks are reproducible}
    pull_policy: always
    # Loopback publish only — Caddy reaches the api over the compose network as
    # `api:8080`, so this mapping exists purely for local curl/probes on the box
    # (deploy.sh, restore.sh and the runbook use it). `!override` REPLACES the
    # base file's 0.0.0.0:8080 publish; without it Compose would merge the two
    # and the api would still be listening on every interface.
    ports: !override
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    logging: *logging
    security_opt:
      - "no-new-privileges:true"
    # ffmpeg runs INSIDE this container, so it is the one service that needs a
    # real resource envelope. Defaults target the 8 vCPU / 16 GB public-launch
    # droplet and leave one core for Postgres + the API itself.
    # IMPORTANT: Docker REJECTS a cpus value above the host's core count — on
    # the 4 vCPU floor droplet set API_CPUS=3.0 and API_MEM_LIMIT=4g.
    cpus: "${API_CPUS:-7.0}"
    mem_limit: ${API_MEM_LIMIT:-6g}
    # HTTP_SHUTDOWN_TIMEOUT defaults to 20s but Docker's default stop grace is
    # 10s, so without this the graceful drain is SIGKILLed halfway.
    stop_grace_period: 30s
    depends_on:
      prep-volumes:
        condition: service_completed_successfully
    environment:
      # THE production assertion. The base file deliberately declares
      # `JWT_SECRET: ${JWT_SECRET:-}` (vidra-core/docker-compose.yml) because it
      # is `include:`d by `make dev`, `make up` and meta-ci, all of which render
      # with no env file at all — and a required-variable reference aborts
      # RENDERING outright, not just booting. Production is where the assertion
      # belongs, and this is it.
      #
      # `:?` fails on EMPTY as well as unset, which is the case that matters:
      # env/production.env.example ships `JWT_SECRET=` blank, so without this
      # line `$COMPOSE config -q` (deploy.sh step 0, `make prod-config`) renders
      # exit-0 on an unedited env file and the failure only surfaces later as an
      # api boot-loop against validate().
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in production - generate with `openssl rand -base64 48` and put it in env/production.env (>=32 bytes; the dev default is rejected at api boot)}
      # Redirects all nine MkdirTemp/CreateTemp sites (HLS ladder, VP9 second
      # encode, the uncompressed PCM wav Whisper needs, trick-play I-frames) off
      # the container writable layer and onto the transcode_tmp volume. Budget
      # ~4x UPLOAD_MAX_SIZE per concurrent transcode; back this volume with a
      # Block Storage device, not the root disk Postgres lives on.
      TMPDIR: /scratch
      # Rewritten because redis now requires a password. ${REDIS_URL} still wins
      # if the operator points at a managed Redis (use a rediss:// URL there).
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required in production (openssl rand -hex 32 - hex not base64, because the value is substituted into a redis:// DSN)}@redis:6379/0}
    volumes:
      # Only load-bearing with STORAGE_BACKEND=local. Without it, media lands on
      # the container writable layer and `up -d` destroys it while the Postgres
      # rows survive, pointing at nothing.
      - media_data:/app/data
      - transcode_tmp:/scratch
    healthcheck:
      # Stricter than the image's baked HEALTHCHECK (/healthz, liveness only):
      # /readyz also proves Postgres and Redis are reachable. The frontend's
      # depends_on condition is service_healthy, so this gates first render.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: ghcr.io/${VIDRA_IMAGE_OWNER:-yegamble}/vidra-user:${VIDRA_USER_TAG:?VIDRA_USER_TAG is required (e.g. v0.1.0) so deploys and rollbacks are reproducible}
    pull_policy: always
    # !override — replaces the base 0.0.0.0:3000 publish, see the api note.
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
    logging: *logging
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  search:
    image: ghcr.io/${VIDRA_IMAGE_OWNER:-yegamble}/vidra-search:${VIDRA_SEARCH_TAG:?VIDRA_SEARCH_TAG is required (e.g. v0.1.0) so deploys and rollbacks are reproducible}
    pull_policy: always
    # Internal service: HMAC-authenticated, called only by vidra-core, never by
    # a browser. The base file publishes SEARCH_HTTP_PORT for local inspection;
    # production removes the publish entirely (`!reset`, see the postgres note).
    ports: !reset []
    restart: unless-stopped
    logging: *logging
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      prep-volumes:
        condition: service_completed_successfully
    environment:
      REDIS_URL: ${SEARCH_REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required in production (openssl rand -hex 32 - hex not base64, because the value is substituted into a redis:// DSN)}@redis:6379/1}
    volumes:
      # Trained ranking models. Losing them is recoverable (the model-loader job
      # rebuilds), but a rebuild costs a full retraining cycle of degraded
      # ranking, so they get a volume.
      - search_models:/var/lib/vidra-search/models

  # ---------------------------------------------------------------------------
  # OPTIONAL-PROFILE SERVICES (base definitions: vidra-core/docker-compose.yml).
  #
  # None of these start unless their profile is enabled — `vidra setup` writes
  # the answers into VIDRA_COMPOSE_PROFILES / EXTRA_COMPOSE_PROFILES and
  # deploy/{deploy,rollback,restore,backup}.sh append every entry as `--profile`.
  # That is precisely why they belong in this overlay: the moment an operator
  # says yes to virus scanning, captions or tracing, the base file's publishes
  # go live on 0.0.0.0 and a host firewall does NOT filter them (DOCKER-USER
  # sits ahead of ufw — overlay header note 1). clamd on :3310 takes unauthenticated
  # commands, and the Jaeger UI on :16686 is an unauthenticated read of every
  # request the api traced.
  #
  # Removing the publish costs nothing operationally: the api reaches all of them
  # over the compose network by SERVICE NAME, which is what the base file's own
  # documented wiring already uses — CLAMAV_ADDR=clamav:3310,
  # WHISPER_ENDPOINT=http://whisper:8080,
  # OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317 — and the collector forwards
  # to `jaeger` the same way. Nothing here is ever addressed as localhost:<port>.
  # To read the Jaeger UI from a workstation, add a loopback publish in a local,
  # untracked overlay and `ssh -L 16686:127.0.0.1:16686 <droplet>`; do not undo
  # the reset here.
  #
  # `!reset []`, not `[]` — Compose MERGES sequence fields across a -f chain, so
  # a plain empty list appends nothing and the base publish survives. See the
  # postgres note above; needs Compose >= 2.24.
  #
  # The `logging:` lines are not optional either: a service that omits the anchor
  # inherits the daemon default, which is UNBOUNDED (header note 4). clamd's
  # freshclam chatter and the collector's per-batch logs are the two most likely
  # things on the box to fill a disk that also holds Postgres.
  # `restart: unless-stopped` for the same reason as postgres/redis/api: header
  # note 3 promises it "everywhere long-lived", and every one of these five IS
  # long-lived. Without it they are the compose default `no` — one OOM kill or
  # one host reboot and they never come back, while the api that depends on them
  # restarts perfectly. The failure is silent by construction: uploads stop being
  # scanned, captions stop being generated and traces stop being exported, and
  # none of that surfaces as an error on the request path.
  clamav:
    ports: !reset []
    restart: unless-stopped
    logging: *logging

  whisper:
    ports: !reset []
    restart: unless-stopped
    logging: *logging

  otel-collector:
    ports: !reset []
    restart: unless-stopped
    logging: *logging

  jaeger:
    ports: !reset []
    restart: unless-stopped
    logging: *logging

  # rtmp keeps its publish: 1935 is the ingest port streamers push to, so it is
  # deliberately internet-facing (open it in the cloud firewall) — same standing
  # exception as the IPFS swarm port below. The log cap and the restart policy
  # are added; a live-ingest server that stays down after a reboot means every
  # streamer's push is refused with nothing in the app logs to say why.
  rtmp:
    restart: unless-stopped
    logging: *logging

  # ---------------------------------------------------------------------------
  # Public IPFS mirror node (base definition: vidra-core/docker-compose.yml).
  # Not started by default: it lives behind the "ipfs" profile — set
  # EXTRA_COMPOSE_PROFILES=ipfs in the env file (deploy.sh appends it) or pass
  # --profile ipfs by hand. The base file already binds the RPC (5001) and the
  # local gateway (9090) to 127.0.0.1; the libp2p swarm port 4001 (tcp+udp) is
  # deliberately public — open it in the cloud firewall or the node runs
  # outbound-only. IPFS_PUBLIC_NETWORK=true announces content to the global
  # DHT; that disclosure is one-way per published object.
  ipfs:
    restart: unless-stopped
    logging: *logging
    cpus: ${IPFS_CPUS:-1.0}
    mem_limit: ${IPFS_MEM_LIMIT:-1g}

  caddy:
    # PINNED, not `caddy:2-alpine`. The floating tag moves under the deploy:
    # the TLS terminator is the one container whose failure is the whole site,
    # and it is also the only one whose config this repo hand-writes, so a
    # silent minor bump is exactly the change that must not arrive unannounced.
    # 2.11.4 is what `caddy:2-alpine` resolved to when this was pinned
    # (digest sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648).
    # Bump deliberately, and bump .github/workflows/meta-ci.yml's `caddy
    # validate` step to the SAME tag in the same commit — otherwise CI is
    # validating deploy/Caddyfile against a different parser than production
    # runs.
    image: caddy:2.11.4-alpine
    # No profile: this file is only ever applied to a production deploy, and the
    # TLS terminator must come up with every one of them.
    restart: unless-stopped
    logging: *logging
    ports:
      # The only two ports on the droplet that face the internet. 80 is required
      # even for an HTTPS-only site: Let's Encrypt's HTTP-01 challenge uses it,
      # and Caddy redirects everything else to 443.
      - "80:80"
      - "443:443"
    depends_on:
      # required: false so a `caddy`-only restart still works if the app
      # services happen to be down; Caddy resolves upstreams at request time,
      # holds each request for deploy/Caddyfile's lb_try_duration waiting for
      # them to come back, and only answers 502 once that expires — which is the
      # behaviour you want.
      api:
        condition: service_started
        required: false
      frontend:
        condition: service_started
        required: false
    volumes:
      # The GENERATED file, not the committed deploy/Caddyfile template.
      # `vidra setup` renders deploy/Caddyfile.local from the template + the env
      # file (site address from PUBLIC_BASE_URL, ACME email and TLS mode at the
      # `# vidra:global-options` / `# vidra:tls` markers), and it is gitignored
      # so an operator's real domain never becomes a commit.
      #
      # It MUST exist before `up -d`: Docker creates a missing bind-mount source
      # as an empty DIRECTORY, and Caddy then crash-loops on a config path that
      # is not a file — the whole site down with every app container healthy.
      # deploy/{deploy,rollback,restore}.sh refuse to start without it.
      #
      # Editing it does NOT recreate this container (same image, same mount), so
      # deploy.sh follows `up -d` with an explicit `caddy reload`.
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      # ACME account key + issued certificates. MUST be a named volume: an
      # ephemeral /data means a fresh certificate order on every `up -d`, and
      # Let's Encrypt's duplicate-certificate limit (5/week) is reached in a
      # single afternoon of deploys.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  # STORAGE_BACKEND=local media root (/app/data/media). Unused with s3.
  media_data:
  # ffmpeg scratch (TMPDIR). Back this with Block Storage — see deploy/README.md.
  transcode_tmp:
  # vidra-search trained ranking models (MODEL_DIR).
  search_models:
  # Caddy ACME account + certificates. Destroying this re-issues certificates.
  caddy_data:
  caddy_config:
