# Selected by deploy/lib.sh when the administrator enables ATProto with no
# external PDS. Only Caddy shares the dedicated PDS network.
services:
  pds:
    image: ghcr.io/bluesky-social/pds:0.4@sha256:b7dcc38b5ec26d03c096c90d4385c4b29c4fdd22daf3b0b36e159f61a81d55c0
    restart: unless-stopped
    env_file:
      - ./env/atproto-pds.env
    environment:
      PDS_HOSTNAME: ${VIDRA_LOCAL_PDS_HOST:?local PDS hostname required}
      PDS_DATA_DIRECTORY: /pds
      PDS_PORT: "2583"
      PDS_INVITE_REQUIRED: "true"
      PDS_RATE_LIMITS_ENABLED: "true"
    volumes:
      - ./data/atproto-pds:/pds
    networks: [atproto]
    ports: ["127.0.0.1:${ATPROTO_PDS_PORT:-2583}:2583"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2583/xrpc/_health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
  caddy:
    environment:
      VIDRA_LOCAL_PDS_HOST: ${VIDRA_LOCAL_PDS_HOST}
    networks: [default, atproto]
    volumes:
      - ./deploy/Caddyfile.atproto-pds:/etc/caddy/Caddyfile:ro
      - ./deploy/Caddyfile.local:/etc/caddy/vidra-site:ro

networks:
  atproto:
